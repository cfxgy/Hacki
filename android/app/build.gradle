plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def requiredSigningProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def releaseSigningConfigured = keystorePropertiesFile.exists() &&
    requiredSigningProperties.every {
        keystoreProperties[it]?.toString()?.trim()
    }
def releaseKeystoreFile = releaseSigningConfigured
    ? file(keystoreProperties['storeFile'])
    : null


android {
    namespace "com.jiaqifeng.hacki"
    compileSdkVersion 37
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_18
        targetCompatibility JavaVersion.VERSION_18
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '24'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.jiaqifeng.hacki"
        minSdkVersion 25
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile releaseKeystoreFile
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // A release build must never fall back to an unsigned or random
            // signing key. The task graph check below fails with a clear
            // message when the stable signing properties are missing.
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def isReleaseBuild = taskGraph.allTasks.any {
        it.name.toLowerCase().contains('release')
    }
    if (isReleaseBuild) {
        if (!keystorePropertiesFile.exists()) {
            throw new GradleException(
                'Release signing is not configured. Add android/key.properties ' +
                '(storeFile, storePassword, keyAlias, keyPassword) or configure ' +
                'the KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD and KEY_ALIAS ' +
                'GitHub Actions secrets. Refusing to build an unsigned release APK.'
            )
        }
        def missing = requiredSigningProperties.findAll {
            !keystoreProperties[it]?.toString()?.trim()
        }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "Release signing is incomplete. Missing key.properties fields: ${missing.join(', ')}. " +
                'Configure the stable release keystore secrets before building.'
            )
        }
        if (releaseKeystoreFile == null || !releaseKeystoreFile.exists()) {
            throw new GradleException(
                "Release keystore not found at '${releaseKeystoreFile}'. " +
                'Add the stable keystore and set storeFile in android/key.properties.'
            )
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.20"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

// --- AGP 9 + Flutter build-dir bridge --------------------------------------
// Flutter's root build.gradle redirects each module's buildDir to
// <root>/build/<module> so `flutter` tooling can locate the built APK. Under
// AGP 9 the ExtractProguardFiles task honors that redirect and writes the
// generated default proguard files to <root>/build/app/intermediates/..., but
// the R8 task resolves those same files against the module's *default*
// projectDir/build (android/app/build/intermediates/...) and fails because
// nothing wrote them there. Copy them into place just before R8 runs.
tasks.matching { it.name == "minifyReleaseWithR8" }.configureEach { r8Task ->
    r8Task.doFirst {
        def defaultsDir = "intermediates/default_proguard_files/global"
        copy {
            from "${project.buildDir}/${defaultsDir}"
            into "${project.projectDir}/build/${defaultsDir}"
        }
    }
}

ext.abiCodes = ["x86_64": 1, "armeabi-v7a": 2, "arm64-v8a": 3]
import com.android.build.OutputFile
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 10 + abiVersionCode
        }
    }
}
