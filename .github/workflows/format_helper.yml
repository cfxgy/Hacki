name: Format Helper
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
      - run: dart format lib/screens/widgets/translation_widgets.dart
      - run: git diff > format.patch
      - uses: actions/upload-artifact@v7
        with:
          name: format-patch-only
          path: format.patch
          if-no-files-found: error