name: Build Android APK (Cloud)

# Manual-only build. Flutter and the Android SDK are installed on the runner,
# so no local Android Studio/Flutter setup is required.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
      split_per_abi:
        description: "Build one APK per ABI instead of a universal APK"
        required: true
        default: false
        type: boolean
      diagnostic:
        description: "Report check failures without failing the workflow"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-apk-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.build_type }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list also requests the removed
          # "tools" package, which makes sdkmanager fail on current images.
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          # AGP 9.3 uses build-tools 36.0.0 and an API 37 platform named
          # android-37.0 (API 37 ships minor-versioned platform packages).
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          flutter doctor -v

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        id: analyze
        continue-on-error: ${{ inputs.diagnostic }}
        run: flutter analyze lib test

      - name: Verify Dart formatting
        id: format
        continue-on-error: ${{ inputs.diagnostic }}
        run: |
          if [[ "${{ inputs.diagnostic }}" == "true" ]]; then
            dart format lib test integration_test
            git diff > format.patch
            test ! -s format.patch
          else
            dart format --output=none --set-exit-if-changed lib test integration_test
          fi

      - name: Upload formatting patch
        if: always() && inputs.diagnostic && steps.format.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: format-patch
          path: format.patch
          if-no-files-found: ignore

      - name: Run tests
        id: test
        continue-on-error: ${{ inputs.diagnostic }}
        run: flutter test

      # Release builds use the repository's stable keystore when configured.
      # Without it the APK is deliberately left unsigned; we never generate a
      # new release key per CI run.
      - name: Configure release signing
        id: signing
        if: inputs.build_type == 'release'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [[ -n "${KEYSTORE_BASE64}" ]]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > app/release.jks
            cat > key.properties <<EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=release.jks
          EOF
            echo "signed=true" >> "${GITHUB_OUTPUT}"
            echo "Using the stable release keystore from repository secrets."
          else
            echo "signed=false" >> "${GITHUB_OUTPUT}"
            echo "No KEYSTORE_BASE64 secret found; release APK will be unsigned."
          fi

      - name: Build APKs
        id: build
        if: inputs.build_type != 'release' || steps.analyze.outcome == 'success' && steps.test.outcome == 'success'
        continue-on-error: ${{ inputs.diagnostic }}
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          SPLIT_PER_ABI: ${{ inputs.split_per_abi }}
          HACKI_BACKEND_URL: ${{ vars.HACKI_BACKEND_URL }}
          HACKI_BACKEND_API_KEY: ${{ secrets.HACKI_BACKEND_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p build/dist
          defines=(
            "--dart-define=HACKI_BACKEND_URL=${HACKI_BACKEND_URL}"
            "--dart-define=HACKI_BACKEND_API_KEY=${HACKI_BACKEND_API_KEY}"
          )
          if [[ "${BUILD_TYPE}" == "release" ]]; then
            # Universal release APK (arm64-v8a + armeabi-v7a).
            flutter build apk --release \
              --target-platform=android-arm,android-arm64 \
              "${defines[@]}"
            cp build/app/outputs/flutter-apk/app-release*.apk \
              build/dist/hacki-release-universal.apk

            # Per-ABI release APKs.
            flutter build apk --release --split-per-abi \
              --target-platform=android-arm,android-arm64 \
              "${defines[@]}"
            for apk in build/app/outputs/flutter-apk/*-release.apk; do
              cp "${apk}" "build/dist/$(basename "${apk}")"
            done
          else
            debug_args=(--debug)
            if [[ "${SPLIT_PER_ABI}" == "true" ]]; then
              debug_args+=(--split-per-abi)
            fi
            flutter build apk "${debug_args[@]}" "${defines[@]}"
            for apk in build/app/outputs/flutter-apk/*.apk; do
              cp "${apk}" "build/dist/$(basename "${apk}")"
            done
          fi
          echo "===== APK sizes ====="
          ls -lh build/dist

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: hacki-${{ inputs.build_type }}-apk-${{ github.run_number }}
          path: build/dist/*.apk
          if-no-files-found: error
          retention-days: 30
